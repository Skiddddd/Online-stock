<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online stock broking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-base: #030712;
      --bg-surface: #0b1220;
      --line: rgba(148, 163, 184, 0.2);
      --text-soft: #94a3b8;
      --brand-a: #38bdf8;
      --brand-b: #34d399;
    }
    body {
      position: relative;
      overflow-x: hidden;
      background:
        linear-gradient(rgba(3, 7, 18, 0.48), rgba(3, 7, 18, 0.48)),
        url("./assets/investment-bg.png") center / cover no-repeat fixed,
        radial-gradient(900px 520px at -8% -5%, rgba(56, 189, 248, 0.18), transparent 55%),
        radial-gradient(780px 460px at 105% 110%, rgba(52, 211, 153, 0.16), transparent 58%),
        var(--bg-base);
      color: #e2e8f0;
      font-family: "Manrope", system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 100%);
      pointer-events: none;
      opacity: 0.12;
      z-index: 0;
    }
    h1, h2, h3, .brand-font {
      font-family: "Space Grotesk", "Manrope", system-ui, sans-serif;
      letter-spacing: -0.02em;
    }
    .glass {
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.62), rgba(7, 11, 24, 0.5));
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 12px 36px rgba(2, 6, 23, 0.35);
    }
    .brand-title {
      background: linear-gradient(95deg, var(--brand-a), var(--brand-b));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .input-luxe {
      background: rgba(9, 14, 28, 0.56);
      border: 1px solid rgba(148, 163, 184, 0.35);
      transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
    }
    .input-luxe:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.7);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.14);
      transform: translateY(-1px);
    }
    #name.input-luxe,
    #email.input-luxe,
    #password.input-luxe {
      background: transparent !important;
      color: rgba(226, 232, 240, 0.65) !important;
      -webkit-text-fill-color: rgba(226, 232, 240, 0.65) !important;
      caret-color: #e2e8f0 !important;
      font-weight: 500;
    }
    #name.input-luxe::placeholder,
    #email.input-luxe::placeholder,
    #password.input-luxe::placeholder {
      color: #94a3b8;
      opacity: 1;
    }
    #name.input-luxe:-webkit-autofill,
    #name.input-luxe:-webkit-autofill:hover,
    #name.input-luxe:-webkit-autofill:focus,
    #email.input-luxe:-webkit-autofill,
    #email.input-luxe:-webkit-autofill:hover,
    #email.input-luxe:-webkit-autofill:focus,
    #password.input-luxe:-webkit-autofill,
    #password.input-luxe:-webkit-autofill:hover,
    #password.input-luxe:-webkit-autofill:focus {
      -webkit-text-fill-color: rgba(226, 232, 240, 0.65);
      -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
      box-shadow: 0 0 0 1000px transparent inset !important;
      transition: background-color 9999s ease-out 0s;
    }
    .surface-chip {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    @keyframes driftA {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(20px, -20px, 0) scale(1.05); }
    }
    @keyframes driftB {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-24px, 22px, 0) scale(1.04); }
    }
    @keyframes pageIn {
      0% { opacity: 0; transform: translateY(14px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes itemIn {
      0% { opacity: 0; transform: translateY(16px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .ambient-blob {
      position: fixed;
      border-radius: 9999px;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }
    .blob-a {
      width: 280px;
      height: 280px;
      top: -70px;
      left: -50px;
      background: rgba(37, 99, 235, 0.2);
      animation: driftA 9s ease-in-out infinite;
    }
    .blob-b {
      width: 320px;
      height: 320px;
      right: -80px;
      bottom: -90px;
      background: rgba(16, 185, 129, 0.18);
      animation: driftB 11s ease-in-out infinite;
    }
    .page-motion {
      animation: pageIn 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .motion-item {
      opacity: 0;
      animation: itemIn 500ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .scene {
      perspective: 1200px;
      transform-style: preserve-3d;
    }
    .tilt-card {
      transform-style: preserve-3d;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      will-change: transform;
    }
    .tilt-card:hover {
      box-shadow: 0 20px 45px rgba(2, 6, 23, 0.55), 0 6px 18px rgba(37, 99, 235, 0.2);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .depth-layer {
      transform: translateZ(24px);
    }
    .btn-3d {
      transform: translateZ(0);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .btn-3d:hover {
      transform: translateY(-2px) translateZ(8px);
      box-shadow: 0 14px 24px rgba(15, 23, 42, 0.45);
      filter: brightness(1.04);
    }
    .btn-3d:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 6px 12px rgba(15, 23, 42, 0.35);
    }
    .tabBtn {
      border: 1px solid transparent;
    }
    .tabBtn:hover {
      border-color: rgba(56, 189, 248, 0.2);
    }
    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 70;
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.7);
      color: #e2e8f0;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 24px rgba(2, 6, 23, 0.35);
      transition: transform 140ms ease, filter 140ms ease, background-color 140ms ease;
    }
    .theme-toggle:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }
    body.light-mode {
      background:
        linear-gradient(rgba(248, 250, 252, 0.78), rgba(241, 245, 249, 0.78)),
        url("./assets/investment-bg.png") center / cover no-repeat fixed,
        radial-gradient(900px 520px at -8% -5%, rgba(59, 130, 246, 0.14), transparent 55%),
        radial-gradient(780px 460px at 105% 110%, rgba(16, 185, 129, 0.14), transparent 58%),
        #f8fafc;
      color: #0f172a;
    }
    body.light-mode .theme-toggle {
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      border-color: rgba(100, 116, 139, 0.35);
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="ambient-blob blob-a"></div>
  <div class="ambient-blob blob-b"></div>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Enable light mode" title="Toggle theme"></button>
  <div id="inlineErrorBanner" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[80] w-[min(92vw,760px)] rounded-xl border border-rose-400/40 bg-rose-500/15 px-4 py-3 text-sm text-rose-100 shadow-[0_14px_40px_rgba(244,63,94,0.22)]"></div>
  <div id="app"></div>

  <script type="module">
    const DB_KEY = "nexus_static_db_v1";
    const API_BASE_KEY = "NEXUS_API_BASE";
    const THEME_KEY = "NEXUS_THEME_MODE";
    const DEFAULT_API_BASE = "https://nexus-production-db17.up.railway.app";
    const queryApiBase = new URLSearchParams(window.location.search).get("api_base");
    if (queryApiBase) {
      localStorage.setItem(API_BASE_KEY, queryApiBase.trim());
    }
    const API_BASE = (localStorage.getItem(API_BASE_KEY) || DEFAULT_API_BASE).replace(/\/+$/, "");

    const DEFAULT_STATE = {
      currentUserId: null,
      users: [
        {
          id: "admin-1",
          email: "admin@nexus.io",
          password: "Admin@123",
          fullName: "Gabby Admin",
          balance: 1000000,
          role: "ADMIN",
          createdAt: new Date().toISOString()
        }
      ],
      transactions: [],
      plans: [
        { id: "plan-1", name: "BTC Core Income", minAmount: 200, maxAmount: 2000, dailyRoi: 0.18, durationDays: 30, risk: "Low", strategy: "Market-neutral BTC basis and hedged carry." },
        { id: "plan-2", name: "Blue Chip Momentum", minAmount: 1000, maxAmount: 25000, dailyRoi: 0.26, durationDays: 60, risk: "Medium", strategy: "Rotational exposure across BTC, ETH, and large-cap alts." },
        { id: "plan-3", name: "Opportunistic Alpha", minAmount: 10000, maxAmount: 250000, dailyRoi: 0.34, durationDays: 90, risk: "High", strategy: "Actively managed swing allocation with strict drawdown controls." }
      ],
      systemConfig: {
        btcAddress: "bc1qynty8rdg8448dektk7yesd9ph0w08tfy7dav3y",
        ethAddress: "0xf4059C384bAa6d60E426F91681F1e62A830E4Ec9",
        usdtAddress: "0xf4059C384bAa6d60E426F91681F1e62A830E4Ec9"
      }
    };

    let activeTab = "dashboard";
    let isRegistering = false;
    let authError = "";
    const LEGACY_BTC_ADDRESS = "bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh";
    const LEGACY_EVM_ADDRESS = "0x71C7656EC7ab88b098defB751B7401B5f6d8976F";
    const LEGACY_PLAN1_MIN = 250;
    const PLAN1_MIN = 200;
    const LEGACY_PLAN1_MAX = 5000;
    const PLAN1_MAX = 2000;
    const PLAN2_MIN = 1000;
    const PLAN3_MIN = 10000;

    const readState = () => {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) {
        localStorage.setItem(DB_KEY, JSON.stringify(DEFAULT_STATE));
        return structuredClone(DEFAULT_STATE);
      }
      try {
        const parsed = JSON.parse(raw);
        const migrated = {
          ...DEFAULT_STATE,
          ...parsed,
          systemConfig: {
            ...DEFAULT_STATE.systemConfig,
            ...(parsed.systemConfig || {})
          },
          users: (Array.isArray(parsed.users) ? parsed.users : DEFAULT_STATE.users).map((u) => ({
            ...u,
            password: u.password || (u.email === "admin@nexus.io" ? "Admin@123" : "User@123"),
            externalWallets: {
              btc: "",
              eth: "",
              usdt: "",
              ...((u && u.externalWallets) || {})
            }
          }))
        };
        migrated.plans = Array.isArray(migrated.plans) ? migrated.plans : [...DEFAULT_STATE.plans];
        const starterPlan = migrated.plans.find((p) => p.id === "plan-1");
        if (starterPlan) {
          starterPlan.minAmount = PLAN1_MIN;
          starterPlan.maxAmount = PLAN1_MAX;
        }
        const professionalPlan = migrated.plans.find((p) => p.id === "plan-2");
        if (professionalPlan) {
          professionalPlan.minAmount = PLAN2_MIN;
        }
        const whalePlan = migrated.plans.find((p) => p.id === "plan-3");
        if (whalePlan) {
          whalePlan.minAmount = PLAN3_MIN;
        }
        if (migrated.systemConfig?.btcAddress === LEGACY_BTC_ADDRESS) {
          migrated.systemConfig.btcAddress = DEFAULT_STATE.systemConfig.btcAddress;
        }
        if (migrated.systemConfig?.ethAddress === LEGACY_EVM_ADDRESS) {
          migrated.systemConfig.ethAddress = DEFAULT_STATE.systemConfig.ethAddress;
        }
        if (migrated.systemConfig?.usdtAddress === LEGACY_EVM_ADDRESS) {
          migrated.systemConfig.usdtAddress = DEFAULT_STATE.systemConfig.usdtAddress;
        }
        const adminUser = migrated.users.find((u) => (u.email || "").toLowerCase() === "admin@nexus.io");
        if (adminUser) {
          adminUser.fullName = "Gabriel Admin";
        }
        localStorage.setItem(DB_KEY, JSON.stringify(migrated));
        return migrated;
      } catch {
        localStorage.setItem(DB_KEY, JSON.stringify(DEFAULT_STATE));
        return structuredClone(DEFAULT_STATE);
      }
    };

    const writeState = (state) => localStorage.setItem(DB_KEY, JSON.stringify(state));
    const uid = () => Math.random().toString(36).slice(2, 11);
    const money = (n) => "$" + Number(n).toLocaleString();
    const normalizeEmail = (value) => String(value || "").trim().toLowerCase();
    const showInlineError = (message) => {
      const el = document.getElementById("inlineErrorBanner");
      if (!el) return;
      const text = message || "Something went wrong.";
      const isInsufficientBalance = /insufficient balance/i.test(text);
      el.textContent = text;
      if (isInsufficientBalance) {
        el.style.background = "linear-gradient(135deg, rgba(190,18,60,0.9), rgba(244,63,94,0.82))";
        el.style.borderColor = "rgba(254,205,211,0.95)";
        el.style.color = "#ffffff";
        el.style.fontWeight = "800";
        el.style.boxShadow = "0 18px 55px rgba(244,63,94,0.5)";
        el.style.letterSpacing = "0.01em";
      } else {
        el.style.background = "";
        el.style.borderColor = "";
        el.style.color = "";
        el.style.fontWeight = "";
        el.style.boxShadow = "";
        el.style.letterSpacing = "";
      }
      el.classList.remove("hidden");
    };
    const clearInlineError = () => {
      const el = document.getElementById("inlineErrorBanner");
      if (!el) return;
      el.textContent = "";
      el.style.background = "";
      el.style.borderColor = "";
      el.style.color = "";
      el.style.fontWeight = "";
      el.style.boxShadow = "";
      el.style.letterSpacing = "";
      el.classList.add("hidden");
    };
    const setWalletInlineMessage = (message, type = "error") => {
      const el = document.getElementById("walletInlineMessage");
      if (!el) return;
      el.textContent = message || "";
      el.classList.remove("hidden");
      if (type === "success") {
        el.className = "text-sm rounded-lg px-3 py-2 mb-4 bg-emerald-500/15 border border-emerald-400/40 text-emerald-200";
      } else {
        el.className = "text-sm rounded-lg px-3 py-2 mb-4 bg-rose-500/15 border border-rose-400/40 text-rose-200";
      }
    };
    const clearWalletInlineMessage = () => {
      const el = document.getElementById("walletInlineMessage");
      if (!el) return;
      el.textContent = "";
      el.className = "hidden";
    };
    const SUN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>';
    const MOON_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a7.5 7.5 0 1 0 9 9 9 9 0 1 1-9-9z"></path></svg>';

    function getThemeMode() {
      return localStorage.getItem(THEME_KEY) || "dark";
    }

    function applyThemeMode(mode) {
      const isLight = mode === "light";
      document.body.classList.toggle("light-mode", isLight);
      const btn = document.getElementById("themeToggle");
      if (btn) {
        btn.innerHTML = isLight ? MOON_ICON : SUN_ICON;
        btn.setAttribute("aria-label", isLight ? "Enable dark mode" : "Enable light mode");
        btn.title = isLight ? "Switch to dark mode" : "Switch to light mode";
      }
    }

    function initThemeToggle() {
      const btn = document.getElementById("themeToggle");
      if (!btn) return;
      btn.onclick = () => {
        const nextMode = document.body.classList.contains("light-mode") ? "dark" : "light";
        localStorage.setItem(THEME_KEY, nextMode);
        applyThemeMode(nextMode);
      };
      applyThemeMode(getThemeMode());
    }

    function promptModal({
      title = "Enter a value",
      message = "",
      placeholder = "",
      confirmLabel = "Confirm",
      cancelLabel = "Cancel",
      type = "text",
      defaultValue = ""
    } = {}) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "fixed inset-0 z-50 flex items-center justify-center bg-slate-950/75 backdrop-blur-md";
        overlay.innerHTML = `
          <div class="glass border border-emerald-300/25 rounded-2xl w-full max-w-md mx-4 p-6 shadow-[0_30px_80px_rgba(5,150,105,0.25)]">
            <h3 class="text-lg font-semibold mb-2 text-emerald-200 tracking-tight">${title}</h3>
            ${message ? `<p class="text-sm text-slate-400 mb-4">${message}</p>` : ""}
            <input id="modalInput" type="${type}" class="input-luxe w-full rounded-xl px-4 py-3 focus:ring-2 focus:ring-emerald-400/50 border-emerald-300/40" placeholder="${placeholder}" value="${defaultValue}" />
            <div class="mt-4 flex gap-2 justify-end">
              <button id="modalCancel" class="btn-3d bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm">${cancelLabel}</button>
              <button id="modalConfirm" class="btn-3d bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-4 py-2 rounded-lg text-sm font-semibold">${confirmLabel}</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const input = overlay.querySelector("#modalInput");
        const cleanup = (value) => {
          overlay.remove();
          resolve(value);
        };
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) cleanup(null);
        });
        overlay.querySelector("#modalCancel").onclick = () => cleanup(null);
        overlay.querySelector("#modalConfirm").onclick = () => cleanup(input.value);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            cleanup(input.value);
          }
          if (e.key === "Escape") cleanup(null);
        });
        input.focus();
      });
    }

    function confirmModal({ title = "Confirm", message = "", confirmLabel = "Confirm", cancelLabel = "Cancel" } = {}) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "fixed inset-0 z-50 flex items-center justify-center bg-slate-950/75 backdrop-blur-md";
        overlay.innerHTML = `
          <div class="glass border border-emerald-300/25 rounded-2xl w-full max-w-md mx-4 p-6 shadow-[0_30px_80px_rgba(5,150,105,0.25)]">
            <h3 class="text-lg font-semibold mb-2 text-emerald-200 tracking-tight">${title}</h3>
            ${message ? `<p class="text-sm text-slate-300 mb-4 whitespace-pre-line">${message}</p>` : ""}
            <div class="mt-4 flex gap-2 justify-end">
              <button id="modalCancel" class="btn-3d bg-slate-800/80 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm">${cancelLabel}</button>
              <button id="modalConfirm" class="btn-3d bg-emerald-500 hover:bg-emerald-400 text-slate-900 px-4 py-2 rounded-lg text-sm font-semibold">${confirmLabel}</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const cleanup = (value) => {
          overlay.remove();
          resolve(value);
        };
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) cleanup(false);
        });
        overlay.querySelector("#modalCancel").onclick = () => cleanup(false);
        overlay.querySelector("#modalConfirm").onclick = () => cleanup(true);
        overlay.addEventListener("keydown", (e) => {
          if (e.key === "Escape") cleanup(false);
          if (e.key === "Enter") cleanup(true);
        });
      });
    }

    function promptEmailModal({ title, placeholder, confirmLabel } = {}) {
      return new Promise((resolve) => {
        const overlay = document.createElement("div");
        overlay.className = "fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur";
        overlay.innerHTML = `
          <div class="glass border border-slate-800 rounded-2xl w-full max-w-md mx-4 p-6">
            <h3 class="text-lg font-semibold mb-2">${title || "Enter your account email"}</h3>
            <p class="text-sm text-slate-400 mb-4">We’ll send a reset link if the account exists.</p>
            <input id="modalEmailInput" type="email" class="input-luxe w-full rounded-xl px-4 py-3" placeholder="${placeholder || "name@company.com"}" />
            <div class="mt-4 flex gap-2 justify-end">
              <button id="modalCancel" class="btn-3d bg-slate-800/80 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm">Cancel</button>
              <button id="modalConfirm" class="btn-3d bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-semibold">${confirmLabel || "Send Link"}</button>
            </div>
          </div>
        `;
        document.body.appendChild(overlay);
        const input = overlay.querySelector("#modalEmailInput");
        const cleanup = (value) => {
          overlay.remove();
          resolve(value);
        };
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) cleanup(null);
        });
        overlay.querySelector("#modalCancel").onclick = () => cleanup(null);
        overlay.querySelector("#modalConfirm").onclick = () => cleanup(input.value);
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            cleanup(input.value);
          }
          if (e.key === "Escape") cleanup(null);
        });
        input.focus();
      });
    }

    async function manualResetPassword(targetEmail = "") {
      const email = normalizeEmail(targetEmail || (await promptModal({
        title: "Manual Reset",
        message: "Enter the account email to reset the password.",
        placeholder: "name@company.com",
        confirmLabel: "Continue",
        type: "email"
      })));
      if (!email) return false;

      const db = readState();
      const user = db.users.find((u) => (u.email || "").toLowerCase() === email);
      if (!user) {
        showInlineError("Account not found.");
        return false;
      }

      const newPassword = (await promptModal({
        title: "Set New Password",
        message: `Manual reset for ${email}. Minimum 6 characters.`,

        confirmLabel: "Reset Password",
        type: "password"

      if (newPassword.length < 6) {

        return false;
      }

      user.password = newPassword;
      writeState(db);
      alert("Password reset successful. You can now sign in.");
      return true;
    }

    async function renderLiveChart() {
      const host = document.getElementById("liveChartBox");
      if (!host) return;
      const renderTradingView = () => {
        host.innerHTML = `
          <iframe
            title="BTCUSDT Chart"
            class="w-full"
            style="height:420px;border:0;"
            src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_btc&symbol=BINANCE:BTCUSDT&interval=60&hidesidetoolbar=1&symboledit=0&saveimage=0&toolbarbg=0f172a&studies=%5B%5D&theme=dark&style=1&timezone=Etc%2FUTC&locale=en"
            allowtransparency="true"
            scrolling="no"
            allowfullscreen
          ></iframe>
        `;
      };

      const renderFallback = async () => {
        try {
          const res = await fetch("https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=3&interval=hourly");
          if (!res.ok) throw new Error("fallback failed");
          const payload = await res.json();
          const points = Array.isArray(payload?.prices) ? payload.prices.slice(-72) : [];
          const values = points.map((p) => Number(p[1])).filter((v) => Number.isFinite(v));
          if (!values.length) throw new Error("no data");

          const min = Math.min(...values);
          const max = Math.max(...values);
          const range = max - min || 1;
          const width = 920;
          const height = 420;
          const pad = 22;
          const path = values.map((value, idx) => {
            const x = pad + (idx * (width - pad * 2)) / Math.max(1, values.length - 1);
            const y = height - pad - ((value - min) / range) * (height - pad * 2);
            return `${idx === 0 ? "M" : "L"}${x.toFixed(2)} ${y.toFixed(2)}`;
          }).join(" ");
          const last = values[values.length - 1];

          host.innerHTML = `
            <div class="px-3 py-2 text-xs text-amber-400 border-b border-slate-800">TradingView blocked on this network. Showing fallback feed.</div>
            <svg viewBox="0 0 ${width} ${height}" class="w-full" style="height:360px" preserveAspectRatio="none">
              <defs>
                <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"></stop>
                  <stop offset="100%" stop-color="#22c55e" stop-opacity="0.35"></stop>
                </linearGradient>
              </defs>
              <path d="${path}" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round"></path>
            </svg>
            <div class="px-3 py-2 text-sm text-emerald-400 border-t border-slate-800">BTC: $${last.toLocaleString()}</div>
          `;
        } catch {
          host.innerHTML = `<div class="h-[420px] flex items-center justify-center text-red-400 text-sm text-center px-4">Live chart unavailable. Network is blocking market providers.</div>`;
        }
      };

      const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), 4500));
      try {
        await Promise.race([
          fetch("https://s.tradingview.com/favicon.ico", { mode: "no-cors", cache: "no-store" }),
          timeout
        ]);
        renderTradingView();
      } catch {
        await renderFallback();
      }
    }

              <div class="bg-slate-900/45 border border-slate-800 rounded-xl p-3">
                <div class="flex items-center gap-2 mb-2">
                  <img src="https://cryptologos.cc/logos/ethereum-eth-logo.png?v=040" alt="Ethereum" class="w-5 h-5" />
                  <label for="ethInput" class="text-sm text-slate-300 font-medium">ETH Wallet Address</label>
                </div>
                <input id="ethInput" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-sm" value="${state.systemConfig.ethAddress}" />
              </div>
              <div class="bg-slate-900/45 border border-slate-800 rounded-xl p-3">
                <div class="flex items-center gap-2 mb-2">
                  <img src="https://cryptologos.cc/logos/tether-usdt-logo.png?v=040" alt="Tether USDT" class="w-5 h-5" />
                  <label for="usdtInput" class="text-sm text-slate-300 font-medium">USDT Wallet Address</label>
                </div>
                <input id="usdtInput" class="w-full bg-slate-900/60 border border-slate-700 rounded-lg p-3 text-sm" value="${state.systemConfig.usdtAddress}" />
              </div>
              <button id="saveConfig" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg font-bold btn-3d">Save Changes</button>
            </div>
          </div>
        `;
      }

      const pending = state.transactions.filter(t => t.status === "PENDING");
      return `
        <div class="space-y-6 scene">
          <h2 class="text-3xl font-bold">${view === "tx" ? "Approve Payments" : "System Overview"}</h2>
          <div class="glass border border-slate-800 rounded-2xl p-4 tilt-card">
            <p class="text-slate-400 mb-4">Pending Requests: ${pending.length}</p>
            ${pending.length ? pending.map(t => `
              <div class="bg-slate-900/35 rounded-xl px-4 py-3 mb-2">
                <div class="flex justify-between">
                  <span>${t.userEmail} | ${t.type} | ${money(t.amount)}</span>
                  <div class="space-x-2">
                    <button class="approveBtn btn-3d bg-emerald-600 px-3 py-1 rounded text-sm" data-id="${t.id}">Approve</button>
                    <button class="rejectBtn btn-3d bg-red-600 px-3 py-1 rounded text-sm" data-id="${t.id}">Reject</button>
                  </div>
                </div>
              </div>
            `).join("") : `<p class="text-slate-500">Everything is up to date.</p>`}
          </div>
        </div>
      `;
    }

    function renderMain(state, user) {
      const isAdmin = user.role === "ADMIN";
      const userItems = [
        ["dashboard", "Dashboard"],
        ["invest", "Invest"],
        ["transactions", "Transactions"],
        ["wallet", "Wallet"]
      ];
      const adminItems = [
        ["admin-overview", "System Overview"],
        ["admin-users", "Manage Users"],
        ["admin-tx", "Approve Payments"],
        ["admin-settings", "Settings"]
      ];
      const items = isAdmin
        ? [...userItems.filter(i => i[0] !== "invest" && i[0] !== "wallet"), ...adminItems]
        : userItems;

      let content = "";
      if (activeTab === "dashboard") content = renderDashboard(user, state.transactions);
      else if (activeTab === "invest") content = renderInvest(state, user);
      else if (activeTab === "wallet") content = renderWallet(state, user);
      else if (activeTab === "transactions") content = renderTransactions(state, user);
      else if (isAdmin && activeTab === "admin-overview") content = renderAdmin(state, "overview");
      else if (isAdmin && activeTab === "admin-users") content = renderAdmin(state, "users");
      else if (isAdmin && activeTab === "admin-tx") content = renderAdmin(state, "tx");
      else if (isAdmin && activeTab === "admin-settings") content = renderAdmin(state, "settings");
      else content = renderDashboard(user, state.transactions);

      const app = document.getElementById("app");
      app.innerHTML = `
        <div class="flex min-h-screen relative z-10">
          <aside class="hidden md:flex w-64 flex-col glass border-r border-slate-800 p-4 scene">
            <div class="flex items-center gap-3 px-2 py-4">
  <div class="w-10 h-10 rounded-full border-[3px] border-slate-200/90 flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-6 h-6 text-slate-200">
      <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="4" />
      <rect x="15" y="24" width="4" height="10" rx="1" fill="#34d399" />
      <rect x="22" y="18" width="4" height="16" rx="1" fill="#2dd4bf" />
      <rect x="29" y="14" width="4" height="20" rx="1" fill="#22c55e" />
    </svg>
  </div>
  <div class="leading-[1.05]">
    <div class="text-slate-100 font-extrabold text-lg md:text-xl tracking-tight">Online</div>
    <div class="text-slate-200 font-semibold text-sm md:text-base tracking-tight">stock broking</div>
  </div>
</div>
          <div class="space-y-1 mt-4">
              ${items.map(([id, label]) => `
                <button class="tabBtn btn-3d w-full text-left px-3 py-2 rounded-lg ${id === activeTab ? "bg-blue-600/30 text-blue-200 border-blue-400/35" : "hover:bg-slate-800/70 text-slate-300"}" data-tab="${id}">${label}</button>
              `).join("")}
            </div>
            <div class="mt-auto pt-6">
              <div class="text-sm text-slate-300 mb-3">${user.fullName}</div>
              <button class="logoutBtn w-full bg-red-600/80 hover:bg-red-600 py-2 rounded-lg btn-3d">Logout</button>
            </div>
          </aside>
          <main class="flex-1 p-4 md:p-8 scene page-motion">
            <div class="md:hidden glass border border-slate-800 rounded-2xl p-3 mb-4">
              <div class="flex items-center justify-end gap-2">
                <div class="flex items-center gap-2">
                  <button id="mobileMenuBtn" class="btn-3d bg-slate-800/80 hover:bg-slate-700 text-slate-100 px-3 py-2 rounded-lg text-sm border border-slate-600/40" aria-expanded="false" aria-controls="mobileMenuPanel">Menu</button>
                  <button class="logoutBtn bg-red-600/80 hover:bg-red-600 py-2 px-3 rounded-lg btn-3d text-sm">Logout</button>
                </div>
              </div>
              <div id="mobileMenuPanel" class="hidden mt-3 space-y-2">
                ${items.map(([id, label]) => `
                  <button class="tabBtn btn-3d w-full text-left text-sm px-3 py-2 rounded-lg ${id === activeTab ? "bg-blue-600/30 text-blue-200 border-blue-400/35" : "hover:bg-slate-800/70 text-slate-300"}" data-tab="${id}">${label}</button>
                `).join("")}
              </div>
            </div>
            <header class="glass border border-slate-800 rounded-2xl p-4 mb-6 flex justify-between items-center tilt-card">
              <span class="text-slate-300">Market Status: <span class="text-emerald-400">Live</span></span>
              <span class="font-bold depth-layer">${money(user.balance)}</span>
            </header>
            ${content}
          </main>
        </div>
      `;

      document.querySelectorAll(".tabBtn").forEach(btn => {
        btn.onclick = () => { activeTab = btn.dataset.tab; render(); };
      });

      const mobileMenuBtn = document.getElementById("mobileMenuBtn");
      const mobileMenuPanel = document.getElementById("mobileMenuPanel");
      if (mobileMenuBtn && mobileMenuPanel) {
        mobileMenuBtn.onclick = () => {
          const isOpen = !mobileMenuPanel.classList.contains("hidden");
          mobileMenuPanel.classList.toggle("hidden", isOpen);
          mobileMenuBtn.setAttribute("aria-expanded", String(!isOpen));
          mobileMenuBtn.textContent = isOpen ? "\u2630 Menu" : "\u2715 Close";
        };
      }

      document.querySelectorAll(".logoutBtn").forEach((btn) => {
        btn.onclick = () => {
          const db = readState();
          db.currentUserId = null;
          writeState(db);
          activeTab = "dashboard";
          render();
        };
      });

      document.querySelectorAll(".investBtn").forEach(btn => {
        btn.onclick = async () => {
          const db = readState();
          const plan = db.plans.find(p => p.id === btn.dataset.plan);
          const valueRaw = await promptModal({
            title: "Invest Amount",
            message: `Plan ${plan.name}. Min ${money(plan.minAmount)}, max ${money(plan.maxAmount)}.`,
            placeholder: String(plan.minAmount),
            confirmLabel: "Continue",
            type: "number",
            defaultValue: String(plan.minAmount)
          });
          const value = Number(valueRaw);
          if (!value) return;
          if (value < plan.minAmount || value > plan.maxAmount) {
            showInlineError("Amount is outside plan limits.");
            return;
          }
          if (value > currentUser(db).balance) {
            showInlineError("Insufficient balance.");
            return;
          }
          const projectedProfit = Number((value * (plan.dailyRoi / 100) * plan.durationDays).toFixed(2));
          const projectedPayout = Number((value + projectedProfit).toFixed(2));
          const confirmText =
            `Plan: ${plan.name}\n` +
            `Principal: ${money(value)}\n` +
            `Lock Period: ${plan.durationDays} days\n` +
            `Estimated Profit: ${money(projectedProfit)}\n` +
            `Estimated Payout: ${money(projectedPayout)}\n\n` +
            `Submit this investment request?`;
          const confirmed = await confirmModal({
            title: "Confirm Investment",
            message: confirmText,
            confirmLabel: "Submit",
            cancelLabel: "Cancel"
          });
          if (!confirmed) return;
          createTx(db, currentUser(db).id, "INVESTMENT", value, "Investment Wallet");
          writeState(db);
          alert("Investment request submitted for admin approval.");
          render();
        };
      });

      const depositBtn = document.getElementById("depositBtn");
      if (depositBtn) {
        depositBtn.onclick = async () => {
          const amountRaw = await promptModal({
            title: "Deposit Amount",
            message: "Enter the USD equivalent you plan to deposit.",
            placeholder: "5000",
            confirmLabel: "Submit",
            type: "number",
            defaultValue: "5000"
          });
          const amount = Number(amountRaw);
          if (!amount || amount <= 0) return;
          const db = readState();
          createTx(db, currentUser(db).id, "DEPOSIT", amount, "Crypto Transfer");
          writeState(db);
          alert("Deposit request submitted.");
          render();
        };
      }

      const withdrawBtn = document.getElementById("withdrawBtn");
      const saveExternalWallets = document.getElementById("saveExternalWallets");
      if (saveExternalWallets) {
        saveExternalWallets.onclick = () => {
          clearWalletInlineMessage();
          const db = readState();
          const userNow = currentUser(db);
          userNow.externalWallets = {
            btc: document.getElementById("externalBtcInput").value.trim(),
            eth: document.getElementById("externalEthInput").value.trim(),
            usdt: document.getElementById("externalUsdtInput").value.trim()
          };
          writeState(db);
          setWalletInlineMessage("External withdrawal addresses saved.", "success");
        };
      }
      if (withdrawBtn) {
        withdrawBtn.onclick = async () => {
          clearWalletInlineMessage();
          const db = readState();
          const userNow = currentUser(db);
          const amount = Number(document.getElementById("withdrawAmountInput")?.value);
          if (!amount || amount <= 0) return;
          if (amount > userNow.balance) {
            setWalletInlineMessage("Insufficient balance.");
            return;
          }
          const asset = String(document.getElementById("withdrawAssetSelect")?.value || "").trim().toUpperCase();
          if (!["BTC", "ETH", "USDT"].includes(asset)) {
            setWalletInlineMessage("Please select BTC, ETH, or USDT.");
            return;
          }
          const wallets = {
            btc: "",
            eth: "",
            usdt: "",
            ...((userNow && userNow.externalWallets) || {})
          };
          const destinationAddress = asset === "BTC" ? wallets.btc : asset === "ETH" ? wallets.eth : wallets.usdt;
          if (!destinationAddress) {
            setWalletInlineMessage(`Please save your external ${asset} address first.`);
            return;
          }
          createTx(db, userNow.id, "WITHDRAWAL", amount, `${asset} To: ${destinationAddress.slice(0, 10)}...`);
          writeState(db);
          document.getElementById("withdrawAmountInput").value = "";
          setWalletInlineMessage("Withdrawal request submitted.", "success");
        };
      }

      document.querySelectorAll(".approveBtn").forEach(btn => {
        btn.onclick = () => {
          const db = readState();
          const tx = db.transactions.find(t => t.id === btn.dataset.id);
          if (!tx || tx.status !== "PENDING") return;
          tx.status = "COMPLETED";
          const u = db.users.find(x => x.id === tx.userId);
          if (u) {
            if (tx.type === "DEPOSIT") u.balance += tx.amount;
            if (tx.type === "WITHDRAWAL" || tx.type === "INVESTMENT") u.balance -= tx.amount;
          }
          writeState(db);
          render();
        };
      });

      document.querySelectorAll(".rejectBtn").forEach(btn => {
        btn.onclick = () => {
          const db = readState();
          const tx = db.transactions.find(t => t.id === btn.dataset.id);
          if (!tx || tx.status !== "PENDING") return;
          tx.status = "REJECTED";
          writeState(db);
          render();
        };
      });

      document.querySelectorAll(".editBalanceBtn").forEach(btn => {
        btn.onclick = async () => {
          const db = readState();
          const u = db.users.find(x => x.id === btn.dataset.id);
          if (!u) return;
          const val = await promptModal({
            title: "Update Balance",
            message: `Update balance for ${u.email}.`,
            placeholder: String(u.balance),
            confirmLabel: "Update",
            type: "number",
            defaultValue: String(u.balance)
          });
          if (val === null) return;
          const num = Number(val);
          if (!Number.isFinite(num) || num < 0) {
            showInlineError("Invalid balance");
            return;
          }
          u.balance = num;
          writeState(db);
          render();
        };
      });

      const saveConfig = document.getElementById("saveConfig");
      if (saveConfig) {
        saveConfig.onclick = () => {
          const db = readState();
          db.systemConfig.btcAddress = document.getElementById("btcInput").value.trim();
          db.systemConfig.ethAddress = document.getElementById("ethInput").value.trim();
          db.systemConfig.usdtAddress = document.getElementById("usdtInput").value.trim();
          writeState(db);
          alert("Settings saved.");
          render();
        };
      }

      init3DEffects();
      initMotionEffects();
      if (activeTab === "dashboard") {
        renderLiveChart();
      }
    }

    function init3DEffects() {
      document.querySelectorAll(".tilt-card").forEach((card) => {
        card.onmousemove = (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const rx = ((y / rect.height) - 0.5) * -10;
          const ry = ((x / rect.width) - 0.5) * 10;
          card.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateZ(8px)`;
        };
        card.onmouseleave = () => {
          card.style.transform = "rotateX(0deg) rotateY(0deg) translateZ(0)";
        };
      });
    }

    function initMotionEffects() {
      const scope = document.querySelector("main") || document.getElementById("app");
      if (!scope) return;
      const items = scope.querySelectorAll(".tilt-card, .btn-3d, .tabBtn");
      items.forEach((el, idx) => {
        el.classList.add("motion-item");
        el.style.animationDelay = `${Math.min(idx * 45, 420)}ms`;
      });
    }

    function render() {
      clearInlineError();
      const state = readState();
      const user = currentUser(state);
      if (!user) return renderAuth(state);
      return renderMain(state, user);
    }

    async function handleResetFromLink() {
      const params = new URLSearchParams(window.location.search);
      const magicToken = params.get("magic_token");
      const token = params.get("reset_token");
      const email = (params.get("email") || "").trim().toLowerCase();

      if (magicToken && email) {
        try {
          const res = await fetch(`${API_BASE}/api/auth/magic-link/consume`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, token: magicToken })
          });
          const raw = await res.text();
          const data = raw ? JSON.parse(raw) : {};
          if (!res.ok) {
            showInlineError(data.error || `Magic link is invalid or expired (${res.status}).`);
            return;
          }

          const db = readState();
          let user = db.users.find((u) => (u.email || "").toLowerCase() === email);
          if (!user) {
            user = {
              id: uid(),
              email,
              password: "",
              fullName: data?.user?.fullName || email.split("@")[0],
              balance: Number(data?.user?.balance || 0),
              role: data?.user?.role || "USER",
              createdAt: new Date().toISOString()
            };
            db.users.push(user);
          }
          db.currentUserId = user.id;
          writeState(db);

          alert("Signed in with magic link.");
          const cleanUrl = window.location.origin + window.location.pathname;
          window.history.replaceState({}, "", cleanUrl);
          render();
          return;
        } catch {
          showInlineError(`Magic link service unavailable at ${API_BASE}.`);
          return;
        }
      }

      if (!token || !email) return;

      const newPassword = (await promptModal({
        title: "Reset Password",
        message: `Reset password for ${email}. Minimum 6 characters.`,
        placeholder: "New password",
        confirmLabel: "Reset Password",
        type: "password"
      })) || "";
      if (newPassword.length < 6) {
        showInlineError("Password must be at least 6 characters.");
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, token, newPassword })
        });
        const raw = await res.text();
        const data = raw ? JSON.parse(raw) : {};
        if (!res.ok) {
          showInlineError(data.error || `Reset link is invalid or expired (${res.status}).`);
          return;
        }

        const db = readState();
        const user = db.users.find((u) => (u.email || "").toLowerCase() === email);
        if (user) {
          user.password = newPassword;
          writeState(db);
        }

        alert("Password reset successful. You can now sign in.");
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, "", cleanUrl);
      } catch {
        console.warn("Password reset service is unavailable. Falling back to manual reset.");
        await manualResetPassword(email);
      }
    }

    initThemeToggle();
    handleResetFromLink().finally(render);
  </script>
</body>
</html>
